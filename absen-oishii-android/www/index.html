<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OISHII - Sistem Absensi Salesman</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#d32f2f">
    <link rel="icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Absen OISHII">
    <meta name="mobile-web-app-capable" content="yes">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #f5f7fa;
            padding: 20px;
        }
        .container {
            text-align: center;
            max-width: 500px;
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .logo {
            font-size: 48px;
            margin-bottom: 8px;
        }
        h1 {
            font-size: 28px;
            color: #d32f2f;
            margin-bottom: 4px;
        }
        .subtitle {
            color: #666;
            font-size: 16px;
            margin-bottom: 24px;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .btn {
            display: block;
            padding: 14px;
            background: #d32f2f;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 500;
            font-size: 16px;
            transition: background 0.3s;
        }
        .btn:hover {
            background: #b71c1c;
        }
        .btn-outline {
            background: white;
            color: #d32f2f;
            border: 2px solid #d32f2f;
        }
        .btn-outline:hover {
            background: #f5f5f5;
        }
        .info {
            margin-top: 20px;
            font-size: 13px;
            color: #999;
        }
        .info a {
            color: #d32f2f;
            text-decoration: none;
        }
        .info a:hover {
            text-decoration: underline;
        }
    </style>
    <script type="module" src="/src/js/license-guard.js"></script>
    <script src="/src/js/pwa-register.js" defer></script>
</head>
<body>
    <div class="container">
        <div class="logo"><img src="/icons/icon-96x96.png" alt="OISHII" style="height:1em;vertical-align:middle;"></div>
        <h1>OISHII</h1>
        <p class="subtitle">Sistem Absensi & Monitoring Salesman</p>

        <div class="btn-group">
            <a href="/auth/login.html" class="btn">🔑 Login</a>
            <a href="/admin/dashboard.html" class="btn btn-outline">📊 Admin Dashboard</a>
            <a href="/salesman/dashboard.html" class="btn btn-outline">📱 Salesman Dashboard</a>
        </div>

        <div class="info">
            
            <p style="margin-top:4px;">
                <a href="admin/dashboard.html">Admin</a> ·
                <a href="salesman/dashboard.html">Salesman</a> ·
                <a href="auth/login.html">Login</a>
            </p>
        </div>
    </div>
</body>
</html>
