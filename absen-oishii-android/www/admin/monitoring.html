<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoring Salesman - OISHII</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#d32f2f">
    <link rel="icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Absen OISHII">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="stylesheet" href="../src/assets/css/admin.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        .map-container {
            padding: 16px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .map-controls {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
            flex-wrap: wrap;
            align-items: center;
        }

        .map-controls select {
            padding: 8px 16px;
            border-radius: 6px;
            border: 1px solid #ddd;
            background: white;
            font-size: 14px;
            min-width: 180px;
        }

        .map-controls button {
            padding: 8px 20px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.2s;
        }

        .btn-refresh-map { background: #d32f2f; color: white; }
        .btn-refresh-map:hover { background: #b71c1c; }

        .btn-zoom-fit { background: #2196F3; color: white; }
        .btn-zoom-fit:hover { background: #1976D2; }

        #map {
            height: calc(100vh - 280px);
            min-height: 400px;
            width: 100%;
            border-radius: 8px;
            border: 1px solid #eee;
        }

        .legend {
            position: absolute;
            bottom: 30px;
            right: 30px;
            background: white;
            padding: 12px 16px;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.15);
            z-index: 1000;
            min-width: 140px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 12px;
            margin: 4px 0;
            color: #333;
        }

        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            flex-shrink: 0;
        }

        .custom-popup .popup-name {
            font-weight: bold;
            font-size: 16px;
            color: #d32f2f;
            margin-bottom: 4px;
        }
        .custom-popup .popup-status { margin: 4px 0; }
        .custom-popup .popup-time {
            font-size: 12px;
            color: #666;
            margin: 2px 0;
        }

        @media (max-width: 768px) {
            .map-controls { flex-direction: column; align-items: stretch; }
            .map-controls select, .map-controls button { width: 100%; }
            #map { height: 50vh; min-height: 300px; }
            .legend { bottom: 10px; right: 10px; padding: 8px 12px; min-width: 100px; }
            .legend-item { font-size: 10px; }
        }
    </style>
    <script type="module" src="/src/js/license-guard.js"></script>
    <script src="/src/js/pwa-register.js" defer></script>
</head>
<body>
    <div id="app" class="admin-app">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <span class="logo-icon"><img src="/icons/icon-96x96.png" alt="OISHII" style="height:1em;vertical-align:middle;"></span>
                <span class="logo-text">OISHII</span>
            </div>
            <nav class="sidebar-nav">
                <a href="/admin/dashboard.html" class="nav-link"><span class="nav-icon">📊</span><span>Dashboard</span></a>
                <a href="/admin/monitoring.html" class="nav-link active"><span class="nav-icon">📍</span><span>Monitoring</span></a>
                <a href="/admin/history.html" class="nav-link"><span class="nav-icon">🗺️</span><span>Histori Perjalanan</span></a>
                <a href="/admin/attendance.html" class="nav-link"><span class="nav-icon">📋</span><span>Absensi</span></a>
                <a href="/admin/salesmen.html" class="nav-link"><span class="nav-icon">👥</span><span>Salesman</span></a>
                <a href="/admin/admins.html" class="nav-link"><span class="nav-icon">👤</span><span>Admin</span></a>
                <a href="/admin/customers.html" class="nav-link"><span class="nav-icon">🏢</span><span>Customer</span></a>
                <a href="/admin/reports.html" class="nav-link"><span class="nav-icon">📈</span><span>Laporan</span></a>
                <a href="/admin/settings.html" class="nav-link"><span class="nav-icon">⚙️</span><span>Pengaturan</span></a>
                <a href="/admin/license.html" class="nav-link"><span class="nav-icon">🔐</span><span>Lisensi</span></a>
            </nav>
            <div class="sidebar-footer">
                <button class="logout-btn" id="logoutBtn"><span class="nav-icon">🚪</span><span>Logout</span></button>
            </div>
        </aside>

        <main class="admin-main">
            <header class="admin-header">
                <div class="header-left">
                    <button class="menu-toggle" id="menuToggle">☰</button>
                    <h1>📍 Monitoring Salesman</h1>
                </div>
                <div class="header-right">
                    <span class="date-display" id="monitoringDate"></span>
                </div>
            </header>

            <div class="map-container">
                <div class="map-controls">
                    <select id="filterSalesman">
                        <option value="all">👥 Semua Salesman</option>
                    </select>
                    <button class="btn-refresh-map" id="refreshMap">🔄 Refresh</button>
                    <button class="btn-zoom-fit" id="zoomFit">🔍 Zoom Semua</button>
                </div>
                <div id="map"></div>

                <div class="legend">
                    <div class="legend-item"><span class="legend-dot" style="background:#4CAF50;"></span><span>Sedang Bekerja</span></div>
                    <div class="legend-item"><span class="legend-dot" style="background:#FF9800;"></span><span>GPS Warning</span></div>
                    <div class="legend-item"><span class="legend-dot" style="background:#f44336;"></span><span>Belum Absen</span></div>
                    <div class="legend-item"><span class="legend-dot" style="background:#666;"></span><span>Sudah Pulang</span></div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script type="importmap">
        {
            "imports": {
                "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm"
            }
        }
    </script>

    <script type="module">
        import { createClient } from '@supabase/supabase-js';

        // ==========================================
        // ⚠️ KONFIGURASI
        // ==========================================
        const SUPABASE_URL      = 'https://pfboaxblozrfranaipzx.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBmYm9heGJsb3pyZnJhbmFpcHp4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0NjY3NTIsImV4cCI6MjEwNTA0Mjc1Mn0.OjuzFEmBDSjOoQExh15ySZqKDM89Jbkkc7724fh-sxc';

        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ==========================================
        // STATE
        // ==========================================
        let map;
        let markersLayer;
        let salesmen = [];
        let attendances = [];
        let lastLocations = {};
        let filterValue = 'all';

        const $ = (id) => document.getElementById(id);

        // ==========================================
        // UTIL
        // ==========================================
        function todayStr() {
            return new Date().toISOString().split('T')[0];
        }

        function timeAgo(iso) {
            if (!iso) return '-';
            const diff = (Date.now() - new Date(iso).getTime()) / 1000;
            if (diff < 60)   return `${Math.floor(diff)}s lalu`;
            if (diff < 3600) return `${Math.floor(diff/60)}m lalu`;
            if (diff < 86400) return `${Math.floor(diff/3600)}j lalu`;
            return `${Math.floor(diff/86400)}h lalu`;
        }

        // ==========================================
        // INIT MAP
        // ==========================================
        function initMap() {
            map = L.map('map').setView([-7.5, 112.2], 10);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap',
                maxZoom: 19
            }).addTo(map);
            markersLayer = L.layerGroup().addTo(map);
        }

        // ==========================================
        // LOAD DATA
        // ==========================================
        async function loadSalesmen() {
            const { data, error } = await supabase
                .from('profiles')
                .select('id, user_id, full_name, employee_code, role, active')
                .eq('role', 'salesman')
                .eq('active', true)
                .order('full_name');
            if (error) { console.error('❌ profiles:', error); return; }
            salesmen = data || [];

            // Isi dropdown
            const sel = $('filterSalesman');
            sel.innerHTML = '<option value="all">👥 Semua Salesman</option>';
            salesmen.forEach(s => {
                const opt = document.createElement('option');
                opt.value = s.user_id;
                opt.textContent = `${s.full_name} (${s.employee_code})`;
                sel.appendChild(opt);
            });
            console.log(`✅ Loaded ${salesmen.length} salesman`);
        }

        async function loadAttendanceToday() {
            const today = todayStr();
            const { data, error } = await supabase
                .from('attendance')
                .select('*')
                .eq('attendance_date', today);
            if (error) { console.error('❌ attendance:', error); return; }
            attendances = data || [];
            console.log(`✅ Loaded ${attendances.length} attendance`);
        }

        async function loadLastLocations() {
            // Ambil data GPS 6 jam terakhir untuk deteksi online/offline,
            // lalu simpan HANYA posisi paling baru per salesman (bukan seluruh riwayat/trail).
            const since = new Date(Date.now() - 6 * 3600 * 1000).toISOString();
            const { data, error } = await supabase
                .from('location_tracking')
                .select('user_id, latitude, longitude, recorded_at, accuracy, speed')
                .gte('recorded_at', since)
                .order('recorded_at', { ascending: false })
                .limit(2000);
            if (error) { console.error('❌ location_tracking:', error); return; }

            lastLocations = {};
            (data || []).forEach(loc => {
                // Data terurut dari yang terbaru -> ambil kemunculan pertama per user_id
                if (!lastLocations[loc.user_id]) {
                    lastLocations[loc.user_id] = loc;
                }
            });
            console.log(`✅ Loaded posisi terkini ${Object.keys(lastLocations).length} salesman`);
        }

        // ==========================================
        // RENDER PETA
        // ==========================================
        function getSalesmanStatus(userId) {
            const att = attendances.find(a => a.user_id === userId);
            if (!att) return 'pending';
            if (att.status === 'checked_out') return 'done';
            if (att.status === 'checked_in') return 'working';
            return 'pending';
        }

        function getMarkerColor(status, gpsStatus) {
            if (status === 'pending') return '#f44336';   // merah
            if (status === 'done')    return '#666';      // abu
            if (gpsStatus === 'offline') return '#FF9800'; // orange
            return '#4CAF50';                              // hijau
        }

        function renderMap() {
            markersLayer.clearLayers();
            const bounds = [];

            const list = filterValue === 'all'
                ? salesmen
                : salesmen.filter(s => s.user_id === filterValue);

            list.forEach(s => {
                const userId = s.user_id;
                const loc = lastLocations[userId];
                if (!loc) return;

                const lat = Number(loc.latitude);
                const lng = Number(loc.longitude);
                const status = getSalesmanStatus(userId);

                const diffMin = (Date.now() - new Date(loc.recorded_at).getTime()) / 60000;
                const gpsStatus = diffMin <= 5 ? 'online' : 'offline';
                const color = getMarkerColor(status, gpsStatus);

                // Marker
                const marker = L.circleMarker([lat, lng], {
                    radius: 10,
                    fillColor: color,
                    color: '#fff',
                    weight: 2,
                    opacity: 1,
                    fillOpacity: 1
                });

                marker.bindPopup(`
                    <div class="custom-popup">
                        <div class="popup-name">${s.full_name}</div>
                        <div class="popup-status">${
                            status === 'working' ? '✅ Sedang Bekerja' :
                            status === 'done'    ? '🏠 Sudah Pulang' :
                                                   '⏳ Belum Absen'
                        }</div>
                        <div class="popup-time">📍 ${lat.toFixed(6)}, ${lng.toFixed(6)}</div>
                        <div class="popup-time">🕐 ${timeAgo(loc.recorded_at)}</div>
                        <div class="popup-time">🎯 Akurasi: ${loc.accuracy ? Math.round(loc.accuracy) + ' m' : '-'}</div>
                    </div>
                `);
                markersLayer.addLayer(marker);
                bounds.push([lat, lng]);
            });

            if (bounds.length) {
                map.fitBounds(bounds, { padding: [40, 40], maxZoom: 15 });
            } else {
                map.setView([-7.5, 112.2], 10);
            }
        }

        // ==========================================
        // REFRESH
        // ==========================================
        async function refreshAll() {
            await Promise.all([
                loadSalesmen(),
                loadAttendanceToday(),
                loadLastLocations()
            ]);
            renderMap();
        }

        // ==========================================
        // INIT
        // ==========================================
        document.addEventListener('DOMContentLoaded', async () => {
            $('monitoringDate').textContent = new Date().toLocaleDateString('id-ID', {
                weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
            });

            initMap();
            await refreshAll();

            // Auto refresh 30 detik
            setInterval(refreshAll, 30000);

            // Tombol refresh
            $('refreshMap').addEventListener('click', refreshAll);

            // Zoom fit
            $('zoomFit').addEventListener('click', () => {
                const bounds = [];
                Object.values(lastLocations).forEach(loc => {
                    bounds.push([Number(loc.latitude), Number(loc.longitude)]);
                });
                if (bounds.length) map.fitBounds(bounds, { padding: [40, 40], maxZoom: 15 });
            });

            // Filter salesman
            $('filterSalesman').addEventListener('change', (e) => {
                filterValue = e.target.value;
                renderMap();
            });

            // Toggle sidebar
            $('menuToggle').addEventListener('click', () => {
                $('sidebar').classList.toggle('open');
            });

            // Logout
            $('logoutBtn').addEventListener('click', async () => {
                await supabase.auth.signOut();
                window.location.href = '/auth/login.html';
            });
        });
    </script>
</body>
</html>
