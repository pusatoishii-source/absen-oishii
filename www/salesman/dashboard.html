<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dashboard Salesman - Oishii</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#d32f2f">
    <link rel="icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Absen Oishii">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="stylesheet" href="../src/assets/css/salesman.css">
    <style>
        /* ==========================================
           SALESMAN DASHBOARD STYLES
           ========================================== */
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: #f5f7fa;
            color: #333;
            min-height: 100vh;
        }

        .salesman-app {
            max-width: 480px;
            margin: 0 auto;
            background: #f5f7fa;
            min-height: 100vh;
            padding-bottom: 80px;
            position: relative;
        }

        /* ==========================================
           HEADER
           ========================================== */

        .app-header {
            background: #d32f2f;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-left .logo {
            color: white;
            font-size: 20px;
            font-weight: bold;
        }

        .header-right {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .btn-icon {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 8px;
            border-radius: 50%;
            cursor: pointer;
            position: relative;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .btn-icon:hover {
            background: rgba(255,255,255,0.3);
        }

        .notification-badge {
            position: absolute;
            top: -2px;
            right: -2px;
            background: #ff9800;
            color: white;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            font-size: 10px;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .date-display {
            color: rgba(255,255,255,0.9);
            font-size: 12px;
        }

        /* ==========================================
           MAIN CONTENT
           ========================================== */

        .main-content {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* ==========================================
           WELCOME SECTION
           ========================================== */

        .welcome-section {
            background: white;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .welcome-section .greeting {
            font-size: 14px;
            color: #888;
        }

        .welcome-section .salesman-name {
            font-size: 24px;
            font-weight: bold;
            color: #d32f2f;
            margin: 4px 0;
        }

        .welcome-section .date-text {
            font-size: 14px;
            color: #999;
        }

        /* ==========================================
           STATUS CARD
           ========================================== */

        .status-card {
            background: white;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .status-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ccc;
            transition: background 0.3s;
        }

        .status-label {
            font-size: 16px;
            font-weight: 500;
        }

        .status-body {
            display: flex;
            justify-content: space-around;
            padding-top: 16px;
            border-top: 1px solid #eee;
        }

        .status-time {
            text-align: center;
        }

        .status-time .time-label {
            display: block;
            font-size: 12px;
            color: #888;
        }

        .status-time .time-value {
            display: block;
            font-size: 20px;
            font-weight: bold;
            color: #333;
            margin-top: 4px;
        }

        .status-divider {
            width: 1px;
            background: #eee;
        }

        /* ==========================================
           GPS STATUS
           ========================================== */

        .gps-status {
            background: white;
            padding: 12px 16px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .gps-indicator {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .gps-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ccc;
            transition: background 0.3s;
        }

        .gps-label {
            font-size: 14px;
        }

        .gps-coords {
            font-size: 12px;
            color: #888;
            font-family: monospace;
        }

        /* ==========================================
           ACTION BUTTONS
           ========================================== */

        .action-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn-primary {
            padding: 16px;
            background: #d32f2f;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: background 0.3s;
        }

        .btn-primary:hover:not(:disabled) {
            background: #b71c1c;
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-primary.success {
            background: #4CAF50;
        }
        .btn-primary.success:hover:not(:disabled) {
            background: #388E3C;
        }

        .btn-secondary {
            padding: 16px;
            background: #f5f5f5;
            color: #333;
            border: 2px solid #ddd;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s;
        }

        .btn-secondary:hover:not(:disabled) {
            background: #eee;
        }

        .btn-secondary:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .btn-icon-text {
            font-size: 20px;
        }

        /* ==========================================
           QUICK STATS
           ========================================== */

        .quick-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .stat-item {
            background: white;
            padding: 16px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .stat-item .stat-number {
            display: block;
            font-size: 22px;
            font-weight: bold;
            color: #d32f2f;
        }

        .stat-item .stat-label {
            display: block;
            font-size: 11px;
            color: #888;
            margin-top: 4px;
        }

        /* ==========================================
           MENU GRID
           ========================================== */

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-top: 4px;
        }

        .menu-item {
            background: white;
            padding: 16px 8px;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            transition: transform 0.2s;
            border: none;
            font-family: inherit;
            width: 100%;
        }

        .menu-item:active {
            transform: scale(0.95);
        }

        .menu-item .menu-icon {
            font-size: 28px;
            display: block;
        }

        .menu-item .menu-label {
            display: block;
            font-size: 11px;
            color: #666;
            margin-top: 6px;
        }

        /* ==========================================
           BOTTOM NAV
           ========================================== */

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            display: flex;
            justify-content: space-around;
            padding: 8px 0;
            box-shadow: 0 -2px 8px rgba(0,0,0,0.1);
            max-width: 480px;
            margin: 0 auto;
            z-index: 100;
        }

        .nav-item {
            background: none;
            border: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 4px 16px;
            cursor: pointer;
            color: #888;
            transition: color 0.2s;
            font-family: inherit;
        }

        .nav-item.active {
            color: #d32f2f;
        }

        .nav-item .nav-icon {
            font-size: 22px;
        }

        .nav-item .nav-label {
            font-size: 10px;
            margin-top: 2px;
        }

        /* ==========================================
           TOAST
           ========================================== */

        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(0,0,0,0.85);
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            max-width: 400px;
            width: 90%;
            text-align: center;
            z-index: 1000;
            transition: all 0.3s ease;
            font-size: 14px;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        .toast.hidden {
            display: none;
        }

        /* ==========================================
           RESPONSIVE
           ========================================== */

        @media (max-width: 400px) {
            .quick-stats {
                grid-template-columns: repeat(3, 1fr);
                gap: 8px;
            }

            .stat-item {
                padding: 12px;
            }

            .stat-item .stat-number {
                font-size: 18px;
            }

            .menu-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
    <script type="module" src="/src/js/license-guard.js"></script>
    <script src="/src/js/native-tracking.js"></script>
    <script src="/src/js/pwa-register.js" defer></script>
</head>
<body>
    <div class="salesman-app" id="app">
        <!-- HEADER -->
        <header class="app-header">
            <div class="header-left">
                <span class="logo"><img src="/icons/icon-96x96.png" alt="Oishii" style="height:1em;vertical-align:middle;"> Oishii</span>
            </div>
            <div class="header-right">
                <span class="date-display" id="headerDate"></span>
                <button class="btn-icon" id="notificationBtn">
                    <span class="notification-badge" id="notificationBadge">0</span>
                    🔔
                </button>
                <button class="btn-icon" id="profileBtn">👤</button>
            </div>
        </header>

        <!-- MAIN CONTENT -->
        <main class="main-content">
            <!-- WELCOME -->
            <section class="welcome-section">
                <p class="greeting" id="greeting">Selamat Pagi,</p>
                <p class="salesman-name" id="salesmanName">Salesman</p>
                <p class="date-text" id="currentDate">Kamis, 03 September 2026</p>
            </section>

            <!-- STATUS CARD -->
            <section class="status-card">
                <div class="status-header">
                    <div class="status-indicator">
                        <span class="status-dot" id="statusDot"></span>
                        <span class="status-label" id="statusLabel">Belum Absen</span>
                    </div>
                </div>
                <div class="status-body">
                    <div class="status-time">
                        <span class="time-label">Jam Masuk</span>
                        <span class="time-value" id="checkInTime">--:--</span>
                    </div>
                    <div class="status-divider"></div>
                    <div class="status-time">
                        <span class="time-label">Jam Pulang</span>
                        <span class="time-value" id="checkOutTime">--:--</span>
                    </div>
                </div>
            </section>

            <!-- GPS STATUS -->
            <section class="gps-status">
                <div class="gps-indicator">
                    <span class="gps-dot" id="gpsDot"></span>
                    <span class="gps-label" id="gpsLabel">GPS: Tidak Aktif</span>
                </div>
                <div class="gps-coords" id="gpsCoords">-</div>
            </section>

            <!-- ACTION BUTTONS -->
            <section class="action-section">
                <button class="btn-primary" id="checkInBtn">
                    <span class="btn-icon-text">✅</span>
                    ABSEN MASUK
                </button>
                <button class="btn-secondary" id="checkOutBtn" disabled>
                    <span class="btn-icon-text">⏹️</span>
                    ABSEN PULANG
                </button>
            </section>

            <!-- QUICK STATS -->
            <section class="quick-stats">
                <div class="stat-item">
                    <span class="stat-number" id="totalToday">0</span>
                    <span class="stat-label">Jam Kerja</span>
                </div>
                <div class="stat-item">
                    <span class="stat-number" id="totalVisits">0</span>
                    <span class="stat-label">Kunjungan</span>
                </div>
                <div class="stat-item">
                    <span class="stat-number" id="trackingPoints">0</span>
                    <span class="stat-label">Titik GPS</span>
                </div>
            </section>

            <!-- MENU GRID -->
            <section class="menu-grid">
                <button class="menu-item" onclick="navigateTo('history')">
                    <span class="menu-icon">📋</span>
                    <span class="menu-label">Histori Absensi</span>
                </button>
                <button class="menu-item" onclick="navigateTo('route')">
                    <span class="menu-icon">🗺️</span>
                    <span class="menu-label">Rute Hari Ini</span>
                </button>
                <button class="menu-item" onclick="navigateTo('profile')">
                    <span class="menu-icon">👤</span>
                    <span class="menu-label">Profil</span>
                </button>
                <button class="menu-item" onclick="showHelp()">
                    <span class="menu-icon">❓</span>
                    <span class="menu-label">Bantuan</span>
                </button>
            </section>
        </main>

        <!-- BOTTOM NAV -->
        <nav class="bottom-nav">
            <button class="nav-item active" onclick="navigateTo('dashboard')">
                <span class="nav-icon">🏠</span>
                <span class="nav-label">Dashboard</span>
            </button>
            <button class="nav-item" onclick="navigateTo('attendance')">
                <span class="nav-icon">📊</span>
                <span class="nav-label">Absensi</span>
            </button>
            <button class="nav-item" onclick="navigateTo('history')">
                <span class="nav-icon">📋</span>
                <span class="nav-label">Riwayat</span>
            </button>
            <button class="nav-item" onclick="navigateTo('profile')">
                <span class="nav-icon">👤</span>
                <span class="nav-label">Profil</span>
            </button>
        </nav>

        <!-- TOAST -->
        <div class="toast hidden" id="toast">
            <span id="toastMessage"></span>
        </div>
    </div>

    <!-- ==========================================
    SCRIPTS
    ========================================== -->
    <script type="importmap">
        {
            "imports": {
                "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm"
            }
        }
    </script>

    <script type="module" src="../src/js/salesman/dashboard.js"></script>

    <script>
        // Navigation helper
        function navigateTo(page) {
            const routes = {
                'dashboard': 'dashboard.html',
                'attendance': 'attendance.html',
                'history': 'history.html',
                'profile': 'profile.html',
                'route': 'route.html'
            };
            
            const target = routes[page];
            if (target && target !== window.location.pathname.split('/').pop()) {
                window.location.href = target;
            }
        }

        function showHelp() {
            alert(
                '📖 Bantuan Salesman Oishii\n\n' +
                '1. ✅ ABSEN MASUK\n' +
                '   - Tekan tombol saat mulai kerja\n' +
                '   - GPS harus aktif\n\n' +
                '2. 📍 TRACKING GPS\n' +
                '   - Otomatis berjalan saat bekerja\n' +
                '   - Mengirim lokasi setiap 5 menit\n\n' +
                '3. ⏹️ ABSEN PULANG\n' +
                '   - Tekan tombol saat selesai kerja\n' +
                '   - Tracking otomatis berhenti\n\n' +
                '4. 📋 HISTORI\n' +
                '   - Lihat riwayat absensi Anda\n\n' +
                '💡 Tips: Pastikan GPS selalu aktif\n' +
                '📞 Hubungi admin jika ada masalah'
            );
        }
    </script>
</body>
</html>
