<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Absensi - Oishii</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#d32f2f">
    <link rel="icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Absen Oishii">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="stylesheet" href="../src/assets/css/salesman.css">
    <style>
        .attendance-container {
            padding: 16px;
        }

        .attendance-container h2 {
            font-size: 18px;
            color: #1a1a2e;
            margin-bottom: 16px;
        }

        /* ==========================================
           TODAY'S STATUS
           ========================================== */

        .today-card {
            background: white;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            margin-bottom: 16px;
        }

        .today-card .label {
            font-size: 13px;
            color: #888;
        }

        .today-card .status-big {
            font-size: 22px;
            font-weight: bold;
            margin: 4px 0 12px;
        }

        .today-card .status-big.checked_in { color: #4CAF50; }
        .today-card .status-big.checked_out { color: #666; }
        .today-card .status-big.pending { color: #999; }

        .today-times {
            display: flex;
            gap: 24px;
            padding-top: 12px;
            border-top: 1px solid #eee;
        }

        .today-times .time-item .label {
            font-size: 11px;
            color: #999;
        }

        .today-times .time-item .value {
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }

        /* ==========================================
           ACTION BUTTONS
           ========================================== */

        .action-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 16px;
        }

        .btn-primary {
            padding: 16px;
            background: #d32f2f;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: background 0.3s;
        }

        .btn-primary:hover:not(:disabled) {
            background: #b71c1c;
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-primary.success {
            background: #4CAF50;
        }
        .btn-primary.success:hover:not(:disabled) {
            background: #388E3C;
        }

        .btn-secondary {
            padding: 16px;
            background: #f5f5f5;
            color: #333;
            border: 2px solid #ddd;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s;
        }

        .btn-secondary:hover:not(:disabled) {
            background: #eee;
        }

        .btn-secondary:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* ==========================================
           HISTORY LIST
           ========================================== */

        .history-card {
            background: white;
            border-radius: 16px;
            padding: 16px 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .history-card h3 {
            font-size: 16px;
            color: #1a1a2e;
            margin-bottom: 12px;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .history-item:last-child {
            border-bottom: none;
        }

        .history-item .date {
            font-weight: 600;
            font-size: 14px;
            color: #333;
        }

        .history-item .times {
            font-size: 13px;
            color: #666;
        }

        .history-item .status {
            font-size: 11px;
            font-weight: 500;
            padding: 2px 10px;
            border-radius: 12px;
        }

        .history-item .status.checked_in {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .history-item .status.checked_out {
            background: #e3f2fd;
            color: #0d47a1;
        }

        .history-item .status.pending {
            background: #f5f5f5;
            color: #999;
        }

        .empty-text {
            text-align: center;
            padding: 20px;
            color: #999;
        }

        .view-all {
            display: block;
            text-align: center;
            padding: 10px;
            color: #d32f2f;
            font-weight: 500;
            cursor: pointer;
            border-top: 1px solid #eee;
            margin-top: 8px;
        }

        .view-all:hover {
            text-decoration: underline;
        }

        /* ==========================================
           GPS STATUS
           ========================================== */

        .gps-status {
            background: white;
            padding: 12px 16px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            margin-bottom: 16px;
        }

        .gps-indicator {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .gps-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ccc;
            transition: background 0.3s;
        }

        .gps-dot.active {
            animation: pulse-gps 1.5s infinite;
        }

        @keyframes pulse-gps {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }

        .gps-label {
            font-size: 14px;
        }

        .gps-coords {
            font-size: 12px;
            color: #888;
            font-family: monospace;
        }

        @media (max-width: 400px) {
            .today-times {
                flex-direction: column;
                gap: 8px;
            }

            .history-item {
                flex-wrap: wrap;
                gap: 4px;
            }
        }
    </style>
    <script type="module" src="/src/js/license-guard.js"></script>
    <script src="/src/js/native-tracking.js"></script>
    <script src="/src/js/pwa-register.js" defer></script>
</head>
<body>
    <div class="salesman-app">
        <!-- HEADER -->
        <header class="app-header">
            <div class="header-left">
                <span class="logo"><img src="/icons/icon-96x96.png" alt="Oishii" style="height:1em;vertical-align:middle;"> Oishii</span>
            </div>
            <div class="header-right">
                <span class="date-display" id="headerDate"></span>
                <button class="btn-icon" id="backBtn">←</button>
            </div>
        </header>

        <main class="main-content">
            <div class="attendance-container">
                <h2>📋 Absensi</h2>

                <!-- GPS STATUS -->
                <div class="gps-status">
                    <div class="gps-indicator">
                        <span class="gps-dot" id="gpsDot"></span>
                        <span class="gps-label" id="gpsLabel">GPS: Tidak Aktif</span>
                    </div>
                    <div class="gps-coords" id="gpsCoords">-</div>
                </div>

                <!-- TODAY'S STATUS -->
                <div class="today-card">
                    <div class="label">Status Hari Ini</div>
                    <div class="status-big pending" id="todayStatus">Belum Absen</div>
                    <div class="today-times">
                        <div class="time-item">
                            <span class="label">Jam Masuk</span>
                            <div class="value" id="todayCheckIn">--:--</div>
                        </div>
                        <div class="time-item">
                            <span class="label">Jam Pulang</span>
                            <div class="value" id="todayCheckOut">--:--</div>
                        </div>
                        <div class="time-item">
                            <span class="label">Durasi</span>
                            <div class="value" id="todayDuration">--:--</div>
                        </div>
                    </div>
                </div>

                <!-- ACTION BUTTONS -->
                <div class="action-section">
                    <button class="btn-primary" id="checkInBtn">
                        <span>✅</span> ABSEN MASUK
                    </button>
                    <button class="btn-secondary" id="checkOutBtn" disabled>
                        <span>⏹️</span> ABSEN PULANG
                    </button>
                </div>

                <!-- RECENT HISTORY -->
                <div class="history-card">
                    <h3>📋 Riwayat Absensi (5 Hari Terakhir)</h3>
                    <div id="recentHistory">
                        <div class="empty-text">Memuat data...</div>
                    </div>
                    <div class="view-all" onclick="navigateTo('profile')">Lihat semua →</div>
                </div>
            </div>
        </main>

        <!-- BOTTOM NAV -->
        <nav class="bottom-nav">
            <button class="nav-item" onclick="navigateTo('dashboard')">
                <span class="nav-icon">🏠</span>
                <span class="nav-label">Dashboard</span>
            </button>
            <button class="nav-item active" onclick="navigateTo('attendance')">
                <span class="nav-icon">📊</span>
                <span class="nav-label">Absensi</span>
            </button>
            <button class="nav-item" onclick="navigateTo('history')">
                <span class="nav-icon">📋</span>
                <span class="nav-label">Riwayat</span>
            </button>
            <button class="nav-item" onclick="navigateTo('profile')">
                <span class="nav-icon">👤</span>
                <span class="nav-label">Profil</span>
            </button>
        </nav>
    </div>

    <!-- TOAST -->
    <div class="toast hidden" id="toast">
        <span id="toastMessage"></span>
    </div>

    <script type="importmap">
        {
            "imports": {
                "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm"
            }
        }
    </script>
    <script type="module" src="../src/js/salesman/attendance.js"></script>

    <script>
        function navigateTo(page) {
            const routes = {
                'dashboard': 'dashboard.html',
                'attendance': 'attendance.html',
                'history': 'history.html',
                'profile': 'profile.html',
                'route': 'route.html'
            };
            const target = routes[page];
            if (target && target !== window.location.pathname.split('/').pop()) {
                window.location.href = target;
            }
        }

        document.getElementById('backBtn').addEventListener('click', () => {
            navigateTo('dashboard');
        });
    </script>
</body>
</html>
